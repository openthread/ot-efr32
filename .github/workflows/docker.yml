name: Docker

env:
  artifact_name: ot-efr32-dev
  image_name: ot-efr32-dev-${{ github.sha }}

on:
  workflow_call:
    outputs:
      artifact_name:
        description: 'The name of the artifact containing the docker image'
        value: ${{ jobs.build.outputs.artifact_name }}
      image_name:
        description: 'The name of the docker image'
        value: ${{ jobs.build.outputs.image_name}}

permissions:
  contents: read

jobs:
  metadata:
    uses: ./.github/workflows/metadata.yml

  build:
    name: Build
    runs-on: ubuntu-22.04
    needs: metadata
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ env.artifact_name }}
      image_name: ${{ env.image_name }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        platforms: linux/amd64

    - name: Build and export to Docker context
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        build-args: |
          BUILD_DATE=${{ needs.metadata.outputs.date }}
        context: .
        file: docker/Dockerfile
        load: true
        tags: |
          ${{ env.image_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Inspect Docker image
      run: docker inspect ${IMAGE_NAME}
      env:
        IMAGE_NAME: ${{ env.image_name }}

    - name: Container image sanity checks
      env:
        IMAGE_NAME: ${{ env.image_name }}
      run: |
        # Download container-structure-test
        curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64 \
          && chmod +x container-structure-test-linux-amd64

        # Run tests
        ./container-structure-test-linux-amd64 test --config docker/test-ot-efr32-dev.yml --image ${IMAGE_NAME}

    - name: Export Docker image
      run: docker save -o ${IMAGE_NAME}.tar ${IMAGE_NAME}
      env:
        IMAGE_NAME: ${{ env.image_name }}

    - name: Upload Docker image
      id: upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.artifact_name }}
        path: ${{ env.image_name }}.tar
